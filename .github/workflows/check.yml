name: Browser checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          npm start > /tmp/soputnik-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm test
