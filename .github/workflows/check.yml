name: Browser checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          npm start > /tmp/soputnik-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm test

  publish:
    name: Publish to GitHub Pages
    needs: smoke
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html app.js style.css favicon.svg _site/
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          site_base="${SITE_URL%/}"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 "$site_base/" -o /tmp/published-index.html
          grep -q '<title>Сопутник' /tmp/published-index.html
          for asset in app.js style.css favicon.svg; do
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 3 --max-time 30 "$site_base/$asset" -o "/tmp/published-$asset"
            cmp "$asset" "/tmp/published-$asset"
          done
