name: Browser checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: |
          (cd _site && node ../server.mjs) > /tmp/soputnik-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm test

  publish:
    name: Publish to GitHub Pages
    needs: smoke
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build versioned public files
        run: npm run build
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: bash scripts/verify-pages.sh "$SITE_URL"
